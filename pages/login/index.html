<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link rel="stylesheet" href="style.css">
    
    <title>Login</title>
</head>
<body>
    <main class="container">
        <form>
            <h1>Login</h1>
        <div class="campo-preencher">
            <input placeholder="E-mail" type="email"> <!-- placeholder é o texto que fica aparcecendo dentro que quando começa a escrever some, type email serve pra quando clicar ele aparecer embaixo users ja usados -->
                <i class="bx bxs-user"></i>
        </div>
        <div class="campo-preencher">
            <input placeholder="Senha" type="password"> <!-- mesma coisa do input de cima -->
                <i class="bx bxs-lock-alt"></i>
        </div>
        
        <div class="remember-forgot">
            
            <label>
                <input type="checkbox">
                Lembrar senha
            </label>
            <a href="#">Esqueci a senha</a>
        </div>
    
        <button type="submit" class="login">Login</button>
    
        <div class="register-link">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>
    
        </form>
    </main>
</body>
</html>
